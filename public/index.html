<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Youtuber Extraxt</title>
  <style>
    body {
      margin: 0;
      font-family: Chirp, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #15202b;
      color: #f7f9fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container { width: 100%; max-width: 550px; padding: 20px; box-sizing: border-box; }
    h1 { font-size: 28px; font-weight: 800; margin-bottom: 24px; text-align: center; }
    .input-group { display: flex; background: #192734; border: 1px solid #38444d; border-radius: 9999px; padding: 6px 6px 6px 16px; }
    .input-group:focus-within { border-color: #1d9bf0; }
    .input-group input { flex: 1; background: transparent; border: none; outline: none; color: #fff; font-size: 16px; }
    .input-group button { background-color: #1d9bf0; color: #fff; border: none; padding: 10px 24px; border-radius: 9999px; font-weight: 700; cursor: pointer; }
    .input-group button:hover { background-color: #1a8cd8; }
    .preview-card { display: none; background: #192734; border: 1px solid #38444d; border-radius: 16px; margin-top: 20px; overflow: hidden; }
    .preview-card img { width: 100%; height: auto; aspect-ratio: 16/9; object-fit: cover; }
    .preview-info { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .preview-title { font-size: 16px; font-weight: 700; margin: 0; }
    .action-btn { background-color: #00ba7c; color: white; text-decoration: none; text-align: center; padding: 12px; border-radius: 9999px; font-weight: 700; display: block; }
    .action-btn:hover { background-color: #00a36c; }
    .status-msg { text-align: center; margin-top: 12px; color: #8899a6; font-size: 14px; }
  </style>
</head>
<body>

<div class="container">
  <h1>Youtuber Extraxt</h1>
  
  <div class="input-group">
    <input type="text" id="videoUrl" placeholder="Paste YouTube link here...">
    <button onclick="processVideoClientSide()">Load Video</button>
  </div>

  <div id="status" class="status-msg"></div>

  <div id="previewCard" class="preview-card">
    <img id="previewImg" src="">
    <div class="preview-info">
      <h3 id="previewTitle" class="preview-title">Video Stream Ready</h3>
      <a id="downloadLink" href="" target="_blank" class="action-btn">Download Video File</a>
    </div>
  </div>
</div>

<script>
  function extractVideoId(url) {
    const regExp = /^.*(?:(?:youtu\.be\/|v\/|vi\/|u\/\w\/|embed\/|shorts\/)|(?:(?:watch)?\?v(?:i)?=|\&v(?:i)?=))([^#\&\?]*).*/;
    const match = url.match(regExp);
    
    // FIXED: Isolates the string array value cleanly and validates it is exactly 11 digits
    return (match && match[1] && match[1].length === 11) ? match[1] : null;
  }

  function processVideoClientSide() {
    const url = document.getElementById('videoUrl').value.trim();
    const statusMsg = document.getElementById('status');
    const previewCard = document.getElementById('previewCard');

    if (!url) {
      statusMsg.innerText = 'Please paste a link first!';
      return;
    }

    const videoId = extractVideoId(url);
    if (!videoId) {
      statusMsg.innerText = 'Invalid YouTube URL format.';
      return;
    }

    statusMsg.innerText = 'Processing secure asset paths...';
    
    // FIXED: Formatted the proper folder structures so your video cover preview displays
    document.getElementById('previewImg').src = 'https://youtube.com' + videoId + '/hqdefault.jpg';

    // FIXED: Replaced the dead domain with the active live online converter portal link
    const dlLink = document.getElementById('downloadLink');
    dlLink.href = 'https://cnvmp3.com/' + videoId; 

    document.getElementById('previewTitle').innerText = 'Video ID: ' + videoId + ' (Ready for Extraction)';
    previewCard.style.display = 'block';
    statusMsg.innerText = 'Click below to finalize your download path connection!';
  }
</script>
</body>
</html>
